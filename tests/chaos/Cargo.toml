[package]
name = "plaudon-chaos-tests"
description = "Crash-injection and interruption suites for durable state transitions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "import-step-runner"
path = "src/bin/import_step_runner.rs"

[[bin]]
name = "cloud-dispatch-runner"
path = "src/bin/cloud_dispatch_runner.rs"

[dependencies]
plaudon-ai-contracts = { workspace = true }
plaudon-ai-openrouter = { workspace = true }
plaudon-app-core = { workspace = true }
plaudon-domain = { workspace = true }
plaudon-jobs = { workspace = true, features = ["fault-injection"] }
plaudon-persistence = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
sqlx = { workspace = true }
tempfile = { workspace = true }
