[package]
name = "plaudon-integration-tests"
description = "Hermetic cross-crate integration tests, fakes and contract fixtures."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
plaudon-ai-whisper = { workspace = true }
plaudon-audio = { workspace = true }
async-trait = { workspace = true }
plaudon-ai-contracts = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
symphonia = { version = "0.5", default-features = false, features = [
    "wav",
    "pcm",
    "mp3",
    "aac",
    "isomp4",
    "ogg",
    "vorbis",
    "flac",
] }
plaudon-app-core = { workspace = true }
plaudon-domain = { workspace = true }
flate2 = { workspace = true }
hex = { workspace = true }
plaudon-export = { workspace = true }
plaudon-persistence = { workspace = true }
plaudon-security = { workspace = true }
plaudon-recording-sources = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
tokio-util = { workspace = true }

[[bin]]
name = "make-archive-fixtures"
path = "src/bin/make_archive_fixtures.rs"

[dev-dependencies]
jsonschema = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
toml = "0.8"
walkdir = { workspace = true }
