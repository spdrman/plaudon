[package]
name = "plaudon-integration-tests"
description = "Hermetic cross-crate integration tests, fakes and contract fixtures."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
plaudon-ai-apple = { workspace = true }
plaudon-ai-whisper = { workspace = true }
plaudon-audio = { workspace = true }
async-trait = { workspace = true }
plaudon-ai-contracts = { workspace = true }
plaudon-ai-openrouter = { workspace = true }
# The compiled speaker-model records the licence register is checked against.
# Default features only: the licence facts are a plain data module, so this
# dependency pulls no inference runtime.
plaudon-ai-speaker = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
symphonia = { version = "0.5", default-features = false, features = [
    "wav",
    "pcm",
    "mp3",
    "aac",
    "isomp4",
    "ogg",
    "vorbis",
    "flac",
] }
plaudon-app-core = { workspace = true }
plaudon-diagnostics = { workspace = true }
plaudon-domain = { workspace = true }
parking_lot = { workspace = true }
plaudon-persistence = { workspace = true }
plaudon-plaud-ble = { workspace = true, features = ["test-support"] }
plaudon-plaud-protocol = { workspace = true }
plaudon-security = { workspace = true, features = ["test-support"] }
plaudon-source-plaud-device = { workspace = true }
plaudon-plaud-usb = { workspace = true }
flate2 = { workspace = true }
hex = { workspace = true }
plaudon-export = { workspace = true }
plaudon-recording-sources = { workspace = true }
plaudon-source-folder = { workspace = true, features = ["test-harness"] }
plaudon-source-plaud-cli = { workspace = true, features = ["test-harness"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
tokio-util = { workspace = true }

[[bin]]
name = "make-archive-fixtures"
path = "src/bin/make_archive_fixtures.rs"

[dev-dependencies]
parking_lot = { workspace = true }
sqlx = { workspace = true }
jsonschema = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
toml = "0.8"
walkdir = { workspace = true }
