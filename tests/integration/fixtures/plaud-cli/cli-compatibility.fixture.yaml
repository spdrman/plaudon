# Fixture compatibility table (spec 7.2, 18.3).
#
# This table exists ONLY for the hermetic test suite. It describes the
# synthetic releases captured under `tests/integration/fixtures/plaud-cli/`,
# so the connector, parser and golden-snapshot machinery can be exercised
# end to end without a vendor account.
#
# It is never loaded by the application: `CliCompatibilityTable::committed()`
# reads `crates/source-plaud-cli/cli-compatibility.yaml`, which has no rows.
# A test asserts that these two documents stay different, so a fixture release
# can never become a shipped compatibility claim by accident.

