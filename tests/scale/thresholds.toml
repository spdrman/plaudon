# N1.4 performance budgets (spec 17.5, 18.6A UI row).
#
# These are ceilings, not targets. `cargo test -p plaudon-scale-tests` compares
# the measured p50, p95 and max of every benchmark against the numbers here and
# fails the run on any breach. Changing what counts as acceptable therefore
# means editing this file, in a commit someone reviews.
#
# How the numbers were set: each budget is the p50/p95/max measured on the
# reference machine recorded in docs/benchmarks/N1.4-scale.md, multiplied by
# `1 + headroom_ratio` and rounded up. `max` budgets get extra slack on top,
# because one scheduler or page-cache hiccup in a sample of forty is not a
# performance regression; sustained regressions show up in p50 and p95.
#
# Why the headroom is as large as it is: a hosted CI runner is commonly two to
# four times slower than the reference workstation, and a budget that only the
# reference machine can meet is a flaky test rather than a performance guard.
# The regressions this file exists to catch — a dropped index at 10,000 rows,
# an N+1 query per visible row, a full-table scan where a keyset lookup was
# intended — change these numbers by an order of magnitude, not by 50%.
#
# Latency is hardware-dependent, so a machine that cannot meet a budget needs a
# documented raise here, not a per-host override: no environment variable can
# loosen a budget.
#
# Grammar: `[table]` headers and `key = number | "string"`. Parsed by
# tests/scale/src/thresholds.rs.

[policy]
schema_version = 1

# Budgets sit this far above a healthy reference measurement.
headroom_ratio = 2.0

# A single commit may raise one budget by at most this fraction. Anything
# larger is a performance regression that needs an ADR, not a bigger number.
max_single_raise_ratio = 0.25

rule = "A benchmark over budget fails the run. Fix the regression, or raise the budget here with the new measurement and the reason in the commit message; a raise above max_single_raise_ratio needs an ADR."

# ---------------------------------------------------------------------------
# Memory-bound harness (spec 17.5: growth proportional to the active chunk
# window, not to total decoded PCM).
# ---------------------------------------------------------------------------
[memory]

# Peak working-set growth allowed, as a multiple of the active chunk window.
window_multiple = 8.0

# Fixed allowance on top of the window, covering allocator arenas, the test
# harness itself and page-granularity accounting. 16 MiB.
slack_bytes = 16777216

# The deliberately unbounded control must grow by at least this fraction of
# the PCM it retains, otherwise the harness is not sensitive enough for its
# own assertion to mean anything.
control_detection_ratio = 0.5

# ---------------------------------------------------------------------------
# CI tier: 501 recordings, 8,000 transcript segments (5,000 of them in one
# transcript). Reference measurement: Mac17,2 / Apple M5 / macOS 27.0.1,
# `cargo test` debug profile, 2026-10-11.
# ---------------------------------------------------------------------------
[ci.library_page_offset]
# measured p50 1.019, p95 1.779, max 1.779
p50_ms = 3.5
p95_ms = 6.0
max_ms = 25.0

[ci.library_page_keyset]
# measured p50 0.487, p95 2.199, max 2.199
p50_ms = 2.0
p95_ms = 7.0
max_ms = 25.0

[ci.transcript_search]
# measured p50 3.420, p95 6.483, max 6.483 — a LIKE scan of every segment
p50_ms = 11.0
p95_ms = 20.0
max_ms = 60.0

[ci.transcript_viewport]
# measured p50 0.796, p95 1.874, max 6.574
p50_ms = 2.5
p95_ms = 6.0
max_ms = 25.0

[ci.archive_accounting]
# measured p50 8.084, p95 9.432, max 9.432 — 501 blobs enumerated and summed
p50_ms = 25.0
p95_ms = 30.0
max_ms = 60.0

[ci.export_manifest]
# measured p50 0.356, p95 1.241, max 2.217
p50_ms = 1.2
p95_ms = 4.0
max_ms = 15.0

# ---------------------------------------------------------------------------
# Full tier: 10,001 recordings, 180,000 transcript segments (spec 17.5 size),
# 100,000 of them in one transcript. Reference measurement: Mac17,2 / Apple M5
# / macOS 27.0.1, debug profile, 2026-10-11; dataset load 163 s, suite 170 s.
# ---------------------------------------------------------------------------
[full.library_page_offset]
# measured p50 9.400, p95 10.851, max 12.008 — OFFSET re-sorts the library per
# page because `recordings` has no index on `captured_at`
p50_ms = 28.0
p95_ms = 33.0
max_ms = 60.0

[full.library_page_keyset]
# measured p50 1.383, p95 1.661, max 2.914 — same pages, same depths, no offset
p50_ms = 4.5
p95_ms = 5.5
max_ms = 25.0

[full.transcript_search]
# measured p50 43.003, p95 132.631, max 132.631 — a LIKE scan of 180,000
# segments joined back to their recordings; the spread is cold page cache on
# the first query of each term
p50_ms = 130.0
p95_ms = 400.0
max_ms = 600.0

[full.transcript_viewport]
# measured p50 0.737, p95 1.185, max 2.924 — index range scan, flat in offset
p50_ms = 2.5
p95_ms = 4.0
max_ms = 20.0

[full.archive_accounting]
# measured p50 37.992, p95 38.967, max 38.967 — 10,001 blobs enumerated,
# summed and reconciled against media_assets
p50_ms = 115.0
p95_ms = 120.0
max_ms = 250.0

[full.export_manifest]
# measured p50 0.271, p95 0.410, max 0.748
p50_ms = 1.0
p95_ms = 1.5
max_ms = 10.0
