[package]
name = "plaudon-egress-scenario"
version.workspace = true
edition.workspace = true
# Declared so `cargo deny check licenses` sees Apache-2.0 rather than an
# unlicensed crate. A workspace member that is never published still appears
# in the dependency graph the licence gate walks.
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "plaudon-egress-scenario"
path = "src/main.rs"

[dependencies]
plaudon-security = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
