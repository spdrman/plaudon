[workspace]
resolver = "2"
members = [
    "crates/*",
    "apps/desktop/src-tauri",
    "tests/integration",
    "tests/chaos",
    "tests/hardware",
    "tests/scale",
    "tests/e2e",
    "tests/egress/monitor",
    "tests/egress/scenario",
    "tests/egress/harness",
]
# `fuzz/` is a standalone cargo-fuzz package; the ci-selftest fixtures are
# deliberately broken crates that must fail their gates (scripts/ci-selftest.sh).
exclude = ["fuzz", "tests/fixtures/ci-selftest"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/spdrman/plaudon"

[workspace.dependencies]
plaudon-domain = { path = "crates/domain" }
plaudon-app-core = { path = "crates/app-core" }
plaudon-recording-sources = { path = "crates/recording-sources" }
plaudon-source-plaud-device = { path = "crates/source-plaud-device" }
plaudon-plaud-protocol = { path = "crates/plaud-protocol" }
plaudon-plaud-ble = { path = "crates/plaud-ble" }
plaudon-plaud-usb = { path = "crates/plaud-usb" }
plaudon-plaud-wifi = { path = "crates/plaud-wifi" }
plaudon-source-plaud-cli = { path = "crates/source-plaud-cli" }
plaudon-source-folder = { path = "crates/source-folder" }
plaudon-audio = { path = "crates/audio" }
plaudon-ai-contracts = { path = "crates/ai-contracts" }
plaudon-ai-openrouter = { path = "crates/ai-openrouter" }
plaudon-ai-whisper = { path = "crates/ai-whisper" }
plaudon-ai-diarization = { path = "crates/ai-diarization" }
plaudon-ai-tools = { path = "crates/ai-tools" }
plaudon-ai-local-llm = { path = "crates/ai-local-llm" }
plaudon-ai-apple = { path = "crates/ai-apple" }
plaudon-jobs = { path = "crates/jobs" }
plaudon-persistence = { path = "crates/persistence" }
plaudon-security = { path = "crates/security" }
plaudon-export = { path = "crates/export" }
plaudon-notifications = { path = "crates/notifications" }
plaudon-automation = { path = "crates/automation" }
plaudon-diagnostics = { path = "crates/diagnostics" }
plaudon-eval = { path = "crates/eval" }
plaudon-updater = { path = "crates/updater" }
plaudon-extraction-eval = { path = "crates/extraction-eval" }
plaudon-release-tools = { path = "crates/release-tools" }

argon2 = { version = "0.6", features = ["kdf"] }
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
fs4 = "1"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
flate2 = "1"
hex = "0.4"
jsonschema = { version = "0.26", default-features = false }
libc = "0.2"
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
parking_lot = "0.12"
proptest = "1"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "multipart", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
symphonia = { version = "0.5", default-features = false }
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time"] }
rand_core = { version = "0.6", features = ["getrandom"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
walkdir = "2"
zeroize = { version = "1", features = ["derive"] }
whisper-rs = { version = "0.16", default-features = false }

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Numeric conversions in DSP and byte-accounting code are deliberate and
# bounds-checked at the point of use; the pedantic cast lints fire on every
# one of them and drown the signal.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Audio code legitimately has `decoded`/`decoder`, `resampled`/`resampler`.
similar_names = "allow"
# Decode and selection loops read better as one function than as a chain of
# single-use helpers.
too_many_lines = "allow"
items_after_statements = "allow"
match_same_arms = "allow"
unnecessary_debug_formatting = "allow"
