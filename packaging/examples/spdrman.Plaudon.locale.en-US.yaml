ShortDescription: Local-first desktop application for importing, transcribing and reviewing your own recordings.
Description: |-
  Plaudon is an independent, local-first desktop application for importing, transcribing and reviewing your own recordings. It is not produced by, affiliated with or approved by PLAUD, OpenRouter or Apple.

  Your recordings, transcripts and summaries live in a library on your own disk. Local-only Mode is on from the first launch and blocks every outbound request until you turn it off. Cloud transcription and cloud models are opt-in and run on keys you supply yourself.

  This installer is UNSIGNED, so SmartScreen will warn about an unknown publisher. Windows support is untested: the installer is built and audited on a Windows runner, but no automated suite runs the application on Windows. It installs per user into %LOCALAPPDATA%\Programs\Plaudon, needs no elevation and writes only to HKCU.

  Importing from a PLAUD account needs the official PLAUD Cloud CLI (@plaud-ai/cli), an npm package WinGet cannot install. Node.js is declared as a dependency, and Plaudon-Setup-Plaud.ps1 — installed beside Plaudon.exe — installs the one pinned CLI version this build drives and runs the vendor's own browser sign-in.

  No warranty of any kind.
