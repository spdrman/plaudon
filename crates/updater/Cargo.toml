[package]
name = "plaudon-updater"
description = "Signed update manifest verification, crash-safe install and verified rollback."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
plaudon-domain = { workspace = true }

base64 = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
plaudon-domain = { workspace = true }
# The negative-path suites need to sign artifacts the fixture generator does
# not produce (a manifest signed by the pinned key whose package signature is
# not), so the test code signs them itself with the committed test keys.
ed25519-dalek = { workspace = true }
jsonschema = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
