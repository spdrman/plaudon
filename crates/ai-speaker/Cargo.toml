[package]
name = "plaudon-ai-speaker"
description = "Speaker-embedding checkpoint facts, Kaldi-compatible features and the optional ONNX engine (ADR-0081)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# ADR-0081 §3: ONNX Runtime through `ort`, statically linked, plus the audio
# decoder the window needs. Off by default and never enabled in a shipped
# build until the §4 gates pass on both reference platforms; the workspace
# `--all-features` runs exclude this crate for the same reason the Apple
# bridge is excluded (scripts/pre-commit.sh, docs/PRECOMMIT.md).
onnx = [
    "dep:ort",
    "dep:plaudon-audio",
    "dep:plaudon-eval",
    "dep:plaudon-security",
    "dep:plaudon-ai-diarization",
]

[dependencies]
async-trait = { workspace = true }
plaudon-ai-contracts = { workspace = true }
plaudon-app-core = { workspace = true }
plaudon-domain = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
ort = { workspace = true, optional = true }
# The diarization contract, its DER metric, the runtime-free half of the
# segmentation pipeline and the artifact type (ADR-0400). Optional because the
# segmentation engine is: a default build of this crate is checkpoint facts and
# a feature front end, nothing more.
plaudon-ai-diarization = { workspace = true, optional = true }
plaudon-audio = { workspace = true, optional = true }
# Inference runs out of process (ADR-0015): the sandbox owns the helper's
# restrictions, its resource caps and the typed frame protocol.
plaudon-security = { workspace = true, optional = true }
# The measurement bridge writes the harness's own document type, so the schema
# cannot drift between the tool that produces it and the tool that reads it.
plaudon-eval = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

# The measurement bridge: builds fixture audio, extracts embeddings for the
# §17.2 harness and reports the ADR-0081 §4 runtime figures. It is a developer
# tool, not a product binary, so it exists only when the runtime does.
[[bin]]
name = "plaudon-speaker-embed"
path = "src/bin/plaudon-speaker-embed.rs"
required-features = ["onnx"]

# The sandboxed inference helper: the process the checkpoint is parsed and run
# in (ADR-0015, ADR-0081 §3). It is a product binary wherever the feature is
# on, and it exists only when the runtime does.
[[bin]]
name = "plaudon-speaker-helper"
path = "src/bin/plaudon-speaker-helper.rs"
required-features = ["onnx"]
