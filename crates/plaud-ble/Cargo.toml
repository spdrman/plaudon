[package]
name = "plaudon-plaud-ble"
description = "BLE central transport for PLAUD devices: read-only discovery policy and an opt-in hardware scanner."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The real radio scanner. Off by default so the workspace builds and tests
# without a Bluetooth stack, and so CI never touches a radio (spec 18.3A).
hardware-scan = ["dep:btleplug", "dep:futures", "dep:uuid", "dep:objc2-core-bluetooth"]
# Exposes the deterministic `FakeDevice` to downstream test harnesses. Never a
# production dependency.
test-support = ["dep:serde_json"]

[dependencies]
async-trait = { workspace = true }
btleplug = { version = "0.11", optional = true }
futures = { version = "0.3", optional = true }
plaudon-domain = { workspace = true }
plaudon-plaud-protocol = { workspace = true }
plaudon-recording-sources = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
uuid = { workspace = true, optional = true }

# Reads the macOS Bluetooth (TCC) authorization without creating a central
# manager, so a scan can tell "not answered yet" from "denied" (#301). The
# same version btleplug already links; only built with `hardware-scan`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-bluetooth = { version = "0.2.2", optional = true, default-features = false, features = ["std", "CBManager"] }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[[bin]]
name = "plaud-ble-scan"
path = "src/bin/scan.rs"
required-features = ["hardware-scan"]
