[package]
name = "plaudon-ui"
description = "egui widgets for the Plaudon desktop shell. Thin: every rule it renders lives in a core crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
egui = { workspace = true }
plaudon-app = { workspace = true }
plaudon-craft-ui = { workspace = true }
plaudon-domain = { workspace = true }
plaudon-transcript-doc = { workspace = true }
# The workspace entry carries `default-features = false`, which keeps cpal out
# of the view layer: the widgets never touch a device, and the kittest suite
# must build in a container with no audio stack. The binary turns the device
# backend back on with `features = ["cpal-output"]`.
plaudon-audio-playback = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
egui = { workspace = true, features = ["default_fonts"] }
egui_kittest = { workspace = true }
plaudon-ui-testkit = { workspace = true }
tempfile = { workspace = true }
