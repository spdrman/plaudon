[package]
name = "plaudon-source-plaud-cli"
description = "Versioned adapter for the official PLAUD Cloud CLI. No private API use."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Loopback-only download policy and fixture-backed compatibility tables, for
# hermetic end-to-end tests. Never enabled by the application: the production
# policy refuses private and loopback destinations outright (spec 7.3), and a
# unit test asserts that it still does while this feature is on.
test-harness = []
# The opt-in capture tool for a real, user-installed vendor CLI. Off by
# default so CI never launches a vendor binary and the workspace builds
# without one (spec 18.3, 18.8).
vendor-cli-probe = []

[dependencies]
async-trait = { workspace = true }
hex = { workspace = true }
plaudon-audio = { workspace = true }
plaudon-diagnostics = { workspace = true }
plaudon-domain = { workspace = true }
plaudon-recording-sources = { workspace = true }
plaudon-security = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

[[bin]]
name = "plaud-cli-probe"
path = "src/bin/probe.rs"
required-features = ["vendor-cli-probe"]
