name: Desktop UI

# Hermetic UI gate for EPIC E: type check, component tests, the WCAG 2.2 AA
# axe assertions and the Playwright keyboard/a11y suite. No network calls to a
# provider and no Tauri process are involved; the suites drive the in-memory
# backend harness. EPIC N may fold these steps into the release matrix.

on:
  push:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-ui.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "schemas/commands/**"
      - "schemas/events/**"
      - ".github/workflows/desktop-ui.yml"

jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Component, contract and accessibility tests
        run: npm run test

      - name: Production bundle
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end and keyboard/WCAG suite
        run: npx playwright test --reporter=line

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/desktop/playwright-report
          retention-days: 7
