name: Extraction Evaluation

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, epic-i-meeting-intelligence]

jobs:
  evaluate:
    name: Run Extraction Evaluation Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Rust toolchain
        id: toolchain
        run: |
          TOOLCHAIN=$(grep '^channel' rust-toolchain.toml | cut -d'"' -f2)
          echo "version=$TOOLCHAIN" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Run extraction evaluation
        run: bash scripts/run-extraction-eval.sh

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extraction-eval-report
          path: target/eval/extraction-eval.json
          retention-days: 30
