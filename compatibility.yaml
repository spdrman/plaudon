# Machine-readable compatibility claim register (spec 2.5B).
#
# This file is the ONLY source of the compatibility strings the application
# shows. No compatibility claim may be written as interface copy, and a probed
# profile that does not match a row here fails closed: no listing, no
# transfer, no "Supported" label.
#
# Promotion rules, enforced by `CompatibilityCell::validate`:
#   * status `supported` requires evidence_level `observed_on_identified_hardware`,
#     a non-empty firmware_range and os_version_range, a test_run_id, a
#     last_verified_at and verified_import_recorded: true.
#   * a firmware or OS change invalidates the cell; use `demoted()` rather than
#     editing a stale row in place.
#
# As of 2026-10-12 no device cell is `supported`. No PLAUD hardware has been
# attached to this build, so every device row is `not_evaluated` or
# `known_unsupported` on vendor documentation. This is a finding, not an
# omission. The official PLAUD Cloud CLI row is `experimental`: one release
# (0.3.15) was exercised end to end on one macOS host, which is an opt-in
# diagnostic level of evidence, not support.

schema_version: 1
updated_at: "2026-10-12"

