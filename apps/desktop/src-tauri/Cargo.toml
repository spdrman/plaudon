[package]
name = "plaudon-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Tauri 2 desktop shell: typed commands, validated arguments and the local library backend."

[lib]
name = "plaudon_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "plaudon-desktop"
path = "src/main.rs"

# A scripted stand-in for the vendor CLI; never part of a release build.
[[bin]]
name = "mock_plaud"
path = "src/bin/mock_plaud.rs"
required-features = ["test-harness"]

[features]
test-harness = []
# Links the Swift bridge so Apple native AI is actually available in the
# bundle. Off by default so a Windows or toolchain-free build still produces
# a working application, with the Apple rows reporting platform_unsupported.
apple-bridge = ["plaudon-ai-apple/apple-bridge"]
# The real Bluetooth radio. Off by default so the workspace builds and tests
# without a Bluetooth stack and CI never touches a radio (spec 18.3A).
hardware-scan = ["plaudon-plaud-ble/hardware-scan", "dep:btleplug"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
plaudon-domain = { workspace = true }
plaudon-persistence = { workspace = true }
plaudon-ai-apple = { workspace = true }
plaudon-ai-contracts = { workspace = true }
plaudon-app-core = { workspace = true }
plaudon-ai-diarization = { workspace = true }
plaudon-export = { workspace = true }
plaudon-notifications = { workspace = true }
plaudon-recording-sources = { workspace = true }
plaudon-security = { workspace = true }
plaudon-diagnostics = { workspace = true }
plaudon-source-plaud-cli = { workspace = true }
plaudon-source-folder = { workspace = true }
plaudon-ai-openrouter = { workspace = true }
plaudon-source-plaud-device = { workspace = true }
plaudon-plaud-ble = { workspace = true }
plaudon-plaud-protocol = { workspace = true }
tokio-util = { workspace = true }
btleplug = { version = "0.11", optional = true }
plaudon-updater = { workspace = true }
async-trait = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
# `assetProtocol.enable` is false in tauri.conf.json (media is served by our
# own `plaudon-media` scheme) and tauri-build rejects a feature/allowlist
# mismatch, so the asset protocol feature stays off.
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
dirs = "6"
sysinfo = "0.37"

[dev-dependencies]
# Enables the mock vendor CLI for this crate's own integration tests.
plaudon-desktop = { path = ".", features = ["test-harness"] }
# The hermetic harness switch: only test builds may accept a loopback origin.
plaudon-source-plaud-cli = { workspace = true, features = ["test-harness"] }
plaudon-plaud-ble = { workspace = true, features = ["test-support"] }
plaudon-security = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }

[lints]
workspace = true
