<?xml version="1.0" encoding="UTF-8"?>
<!--
  Plaudon application icon — original artwork for this repository, drawn from
  primitives (no third-party asset, font or trace is used).

  The mark is the product in one glyph: five bars of a waveform, centred on a
  common axis and drawn as rounded capsules so the shape survives being
  scaled down to a 16-pixel menu-bar entry. There is no microphone in it,
  because Plaudon never records: it reads recordings that already exist.

  Colours are the design-system light-theme accent (`crates/ui/src/theme/
  tokens.rs`: accent #1a4fa0 on accent-text #ffffff), so the icon cannot drift
  away from the palette the application paints with.

  This file is the source. `scripts/make-app-icon.sh` rasterises it to
  `icon-1024.png` (the master raster every platform derives from), builds
  `windows/plaudon.ico`, and `scripts/package-macos-egui.sh` builds the
  `.icns` from the same master at package time.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Plaudon</title>
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="#1a4fa0"/>
  <g fill="#ffffff">
    <rect x="264" y="470" width="64" height="84" rx="32"/>
    <rect x="372" y="398" width="64" height="228" rx="32"/>
    <rect x="480" y="286" width="64" height="452" rx="32"/>
    <rect x="588" y="358" width="64" height="308" rx="32"/>
    <rect x="696" y="442" width="64" height="140" rx="32"/>
  </g>
</svg>
