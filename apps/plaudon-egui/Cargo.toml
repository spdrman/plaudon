[package]
name = "plaudon-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The egui/eframe desktop shell for Plaudon (EPIC O spike): window, host hooks and the view over plaudon-app."

[lib]
name = "plaudon_egui"

[[bin]]
name = "plaudon-egui"
path = "src/main.rs"

[features]
# Links the Swift bridge so Apple native AI is available in the bundle. Off by
# default so a Windows or toolchain-free build still produces a working
# application, with the Apple rows reporting `platform_unsupported`.
#
# `plaudon-ai-apple` is named *directly* and not only through `plaudon-app`
# because Cargo sets `DEP_<LINKS>_*` for the build script of a package that
# depends on the `links` package directly, and nowhere else. Without the
# direct edge `build.rs` would find no `DEP_PLAUDONAPPLEBRIDGE_LINK_ARGS`,
# silently drop the `/usr/lib/swift` rpath and the weak `Speech`/
# `FoundationModels` references, and the bundle would fail to launch. This is
# the same edge `apps/desktop/src-tauri` carried for the same reason.
apple-bridge = [
    "plaudon-app/apple-bridge",
    "dep:plaudon-ai-apple",
    "plaudon-ai-apple/apple-bridge",
]
# The real Bluetooth radio. Off by default so CI never touches a radio.
hardware-scan = ["plaudon-app/hardware-scan"]
# The local whisper.cpp speech engine. Off by default because it compiles
# whisper.cpp, which every `cargo test -p plaudon-egui` would otherwise have
# to build; with it off the transcribe executor reports the engine as
# unavailable in this build rather than pretending a model could run. A
# release bundle is expected to turn it on — see docs/EGUI_BUILD.md.
local-whisper = ["plaudon-app/local-whisper"]

[dependencies]
plaudon-app = { workspace = true }
# The real output device. The workspace entry carries
# `default-features = false` so the view layer and the kittest suite build in
# a container with no audio stack; the shipped binary is the one place that
# turns the `cpal` backend back on.
plaudon-audio-playback = { workspace = true, features = ["cpal-output"] }
plaudon-craft-ui = { workspace = true }
plaudon-domain = { workspace = true }
plaudon-diagnostics = { workspace = true }
plaudon-platform = { workspace = true }
plaudon-ui = { workspace = true }
# Only to make the Swift link arguments reachable: see the `apple-bridge`
# feature. No Rust code in this crate calls it; the application layer owns the
# engine.
plaudon-ai-apple = { workspace = true, optional = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
egui = { workspace = true, features = ["default_fonts"] }
rfd = { workspace = true, features = ["xdg-portal"] }
tokio = { workspace = true }
tracing = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
# The tray backend (matrix row C11). Deliberately not a Linux dependency: the
# `tray-icon` Linux backends link GTK and libappindicator, which the headless
# build and the MARS container do not carry, and a Linux tray additionally
# needs a StatusNotifierItem host. `plaudon_platform::tray::NativeTray` says so
# there instead.
tray-icon = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# The application menu in the system menu bar (parity row S8). macOS only:
# Windows and Linux keep the in-window menu bar, which is where their menu
# belongs. `muda` is already linked here through `tray-icon`, at this version,
# so naming it directly adds no package to the graph — it only stops the
# application menu depending on the tray crate for its types.
muda = { workspace = true }
# The Objective-C runtime, for the one thing winit does not surface: a
# document or `plaudon://` link the OS hands a *running* application
# (parity row C10, `src/mac_open.rs`). All three are already in the graph at
# these versions through `tray-icon`/`muda`, so naming them adds no package.
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSResponder"] }
objc2-foundation = { workspace = true, features = [
    "NSArray",
    "NSNotification",
    "NSString",
    "NSURL",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Window-system backends are Linux-only features of winit; `default-features`
# is off, so they have to be named.
eframe = { workspace = true, features = ["x11", "wayland"] }

[dev-dependencies]
# The integration suite builds the fakes the edges need: a device radio
# (`DeviceRadio` names types from the BLE and protocol crates) and a
# recording HTTPS transport. All four are already in the graph through
# `plaudon-app`.
async-trait = { workspace = true }
# The scripted speech and text engines the processing tests run against.
plaudon-app = { workspace = true, features = ["test-support"] }
plaudon-ai-openrouter = { workspace = true }
plaudon-plaud-ble = { workspace = true }
plaudon-plaud-protocol = { workspace = true }
plaudon-security = { workspace = true }
plaudon-transcript-doc = { workspace = true }
plaudon-ui-testkit = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
